name: Update Johnshall Shadowrocket ad provider

on:
  workflow_dispatch:
  schedule:
    # Upstream rebuilds around 08:00 Asia/Shanghai; allow time for publication.
    - cron: '15 9 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: update-johnshall-shadowrocket-ad
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Convert latest upstream rules
        run: bash script/clash/update-johnshall-shadowrocket-ad.sh

      - name: Commit provider update
        run: |
          if git diff --quiet -- config/clash/rule-providers/johnshall-shadowrocket-ad.txt; then
            echo "Provider is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/clash/rule-providers/johnshall-shadowrocket-ad.txt
          git commit -m "Update Johnshall Shadowrocket ad rules"
          git push
