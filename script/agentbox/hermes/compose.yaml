name: agentbox-hermes
services:
  hermes:
    image: nousresearch/hermes-agent:v0.23.5@sha256:bc79a80fc9cb97521f4380c5d5b2ad88e2469e50fc1d5027339bbb42cc206854
    platform: linux/amd64
    container_name: agentbox-hermes
    pull_policy: never
    command: [gateway, run]
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 6g
    cpus: 4.0
    pids_limit: 1024
    # Official s6 bootstrap starts as root and drops application processes
    # to this UID. Setting Compose user: would bypass that bootstrap.
    environment:
      HERMES_UID: '10000'
      HERMES_GID: '10000'
      HERMES_HOME: /opt/data
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace:/tmp
      HERMES_DASHBOARD: '1'
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: '9119'
      TZ: Asia/Shanghai
    env_file: [/srv/agentbox/proxy.env]
    working_dir: /workspace
    volumes:
      - ./data:/opt/data
      - ./workspace:/workspace
    networks: [agentbox-egress, agentbox-browser]
    dns: [172.18.0.1]
    # Publish only on loopback; fronted by private-domain-gateway on Tailscale.
    ports:
      - '127.0.0.1:9119:9119'
    healthcheck:
      test:
        - CMD
        - /opt/hermes/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=5)"
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
networks:
  agentbox-egress:
    external: true
  agentbox-browser:
    external: true
