name: agentbox-site-check
services:
  site-check:
    image: agentbox-chrome-us:v2.56.2-1@sha256:c9b1dd7e9652ced2b30274649883ee6ae34ba3382306b56995b8a73ce227a874
    pull_policy: never
    entrypoint: [node, /app/check.mjs]
    command: [run]
    user: '0:0'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    tmpfs: ['/tmp:size=16m,mode=1777']
    env_file: [/srv/agentbox/headless-chrome/client.env]
    environment:
      HOME: /tmp
      TZ: America/Los_Angeles
    volumes:
      - ./app:/app:ro
      - ./output:/output
    networks: [agentbox-browser]
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'
networks:
  agentbox-browser:
    external: true
