name: perkradar

services:
  web:
    build:
      context: ./source
      network: host
    image: perkradar:2688cc5-board-read-60s
    container_name: perkradar
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOST: "0.0.0.0"
      PORT: "38471"
      DATA_DIR: /data
      PERKRADAR_ACCESS_TOKEN: ${PERKRADAR_ACCESS_TOKEN:?access token required}
      PERKRADAR_SECURE_COOKIE: "1"
      DISABLE_SCHEDULER: "1"
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: ${PERKRADAR_PROXY_URL:-http://172.18.0.1:7898}
      HTTPS_PROXY: ${PERKRADAR_PROXY_URL:-http://172.18.0.1:7898}
      NO_PROXY: localhost,127.0.0.1,::1,perkradar,172.18.0.0/16
    ports:
      - "127.0.0.1:38471:38471"
    volumes:
      - ./data:/data
    networks:
      - agentbox-egress
    dns:
      - 172.18.0.1
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:38471/api/health',{headers:{Authorization:'Bearer '+process.env.PERKRADAR_ACCESS_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  agentbox-egress:
    external: true
    name: ${PERKRADAR_NETWORK:-agentbox-egress}
