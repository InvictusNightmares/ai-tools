<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERIDIAN-7 // MAINFRAME ACCESS TERMINAL</title>
<meta name="description" content="Deep space relay station MERIDIAN-7 mainframe access terminal. Authorized crew only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #100a02;
    --tube: #1a1206;
    --amber: #ffb000;
    --amber-bright: #ffd47e;
    --amber-dim: rgba(255, 176, 0, 0.52);
    --amber-faint: rgba(255, 176, 0, 0.28);
    --alert: #ff6a3d;
    --glow: 0 0 6px rgba(255, 176, 0, 0.5), 0 0 22px rgba(255, 176, 0, 0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: "VT323", "Courier New", monospace;
    color: var(--amber);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--amber); color: var(--bg); }

  .skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 100;
    background: var(--amber); color: var(--bg); padding: 8px 16px; font-size: 20px;
  }
  .skip-link:focus { left: 0; }
  :focus-visible { outline: 2px solid var(--amber-bright); outline-offset: 2px; }

  /* ---------- CRT enclosure ---------- */
  .crt {
    position: fixed;
    inset: clamp(8px, 2vw, 24px);
    background: var(--tube);
    border: 2px solid rgba(255, 176, 0, 0.22);
    border-radius: 18px;
    box-shadow:
      inset 0 0 80px rgba(0, 0, 0, 0.65),
      0 0 0 4px #060401,
      0 0 60px rgba(255, 176, 0, 0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition-property: transform, filter;
    transition-duration: 90ms;
  }
  .crt.glitch {
    transform: skewX(0.5deg) translateX(2px);
    filter: brightness(1.25) contrast(1.1);
  }

  .crt::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.24) 0px, rgba(0, 0, 0, 0.24) 1px,
      transparent 1px, transparent 4px
    );
    pointer-events: none;
    z-index: 30;
  }
  .crt::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, 0.55) 100%);
    pointer-events: none;
    z-index: 31;
  }
  .flicker {
    position: absolute; inset: 0;
    background: rgba(255, 200, 90, 0.02);
    pointer-events: none;
    z-index: 32;
    animation: flick 4.2s steps(60) infinite;
  }
  @keyframes flick {
    0%, 100% { opacity: 0.35; }
    8% { opacity: 0.7; }
    9% { opacity: 0.2; }
    38% { opacity: 0.55; }
    40% { opacity: 0.1; }
    78% { opacity: 0.6; }
  }

  /* ---------- top status bar ---------- */
  .statusbar {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--amber-faint);
    font-size: clamp(15px, 2vw, 19px);
    letter-spacing: 0.06em;
    color: var(--amber-dim);
    text-shadow: var(--glow);
    flex-shrink: 0;
    flex-wrap: wrap;
    position: relative;
    z-index: 5;
  }
  .statusbar .live { color: var(--amber); font-variant-numeric: tabular-nums; }
  .statusbar .sig { white-space: nowrap; }

  /* ---------- telemetry strip ---------- */
  .telemetry {
    display: flex;
    gap: 26px;
    flex-wrap: wrap;
    padding: 8px 22px;
    border-bottom: 1px solid var(--amber-faint);
    font-size: clamp(13px, 1.8vw, 17px);
    color: var(--amber-dim);
    text-shadow: var(--glow);
    flex-shrink: 0;
    position: relative;
    z-index: 5;
  }
  .tele { display: flex; align-items: baseline; gap: 8px; }
  .tele .k { letter-spacing: 0.12em; }
  .tele .v { color: var(--amber); font-variant-numeric: tabular-nums; }
  .tele .spark { color: var(--amber-bright); letter-spacing: 0.05em; }

  /* ---------- output ---------- */
  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px 12px;
    font-size: clamp(17px, 2.2vw, 22px);
    line-height: 1.42;
    letter-spacing: 0.02em;
    text-shadow: var(--glow);
    scrollbar-width: thin;
    scrollbar-color: var(--amber-faint) transparent;
    position: relative;
    z-index: 5;
  }
  .screen::-webkit-scrollbar { width: 8px; }
  .screen::-webkit-scrollbar-thumb { background: var(--amber-faint); }

  #rain {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.55;
    pointer-events: none;
  }
  #out { white-space: pre-wrap; word-break: break-all; position: relative; z-index: 1; }
  #out .dim { color: var(--amber-dim); }
  #out .bright { color: var(--amber-bright); }
  #out .warn { color: var(--alert); text-shadow: 0 0 8px rgba(255, 106, 61, 0.45); }
  #out .hr { color: var(--amber-faint); }

  /* ---------- input line ---------- */
  .promptline {
    display: flex;
    align-items: baseline;
    padding: 10px 22px 18px;
    font-size: clamp(17px, 2.2vw, 22px);
    text-shadow: var(--glow);
    flex-shrink: 0;
    cursor: text;
    position: relative;
    z-index: 5;
  }
  .promptline .ps1 { color: var(--amber-bright); margin-right: 10px; white-space: nowrap; }
  .promptline .typed { white-space: pre-wrap; word-break: break-all; }
  .cursor {
    display: inline-block;
    width: 0.62em; height: 1.08em;
    background: var(--amber);
    box-shadow: var(--glow);
    transform: translateY(0.18em);
    margin-left: 1px;
    animation: blink 1.06s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #kb {
    position: absolute;
    opacity: 0;
    width: 1px; height: 1px;
    pointer-events: none;
  }

  a { color: var(--amber-bright); }
  .footer-hint {
    position: absolute;
    right: 26px; bottom: 8px;
    font-size: 14px;
    color: var(--amber-faint);
    z-index: 33;
    letter-spacing: 0.1em;
  }
  .back-hub {
    font-size: clamp(15px, 2vw, 19px);
    color: var(--amber-dim);
    letter-spacing: 0.1em;
    text-decoration: none;
    font-family: "VT323", monospace;
    text-shadow: var(--glow);
    transition-property: color;
    transition-duration: 200ms;
  }
  @media (hover:hover) { .back-hub:hover { color: var(--amber-bright); } }

  @media (prefers-reduced-motion: reduce) {
    .flicker { animation: none; opacity: 0.25; }
    .cursor { animation: none; }
    .crt.glitch { transform: none; filter: none; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#kb">跳到命令输入</a>

<div class="crt" id="crt">
  <div class="statusbar">
    <span>MERIDIAN-7 · RELAY MAINFRAME · TTY1</span>
    <span class="live" id="clock">SD 4473.000</span>
    <span class="sig">UPLINK <span class="live" id="sig">▮▮▮▯▯ 63.7%</span></span>
    <a class="back-hub" href="../index.html" aria-label="返回五个世界门户">← EXIT</a>
  </div>

  <div class="telemetry" aria-hidden="true">
    <span class="tele"><span class="k">REACTOR</span><span class="v" id="tv0">87.3%</span><span class="spark" id="ts0"></span></span>
    <span class="tele"><span class="k">O2</span><span class="v" id="tv1">96.1%</span><span class="spark" id="ts1"></span></span>
    <span class="tele"><span class="k">SIGNAL</span><span class="v" id="tv2">63.7%</span><span class="spark" id="ts2"></span></span>
    <span class="tele"><span class="k">GRAV RING</span><span class="v" id="tv3">4.21rpm</span><span class="spark" id="ts3"></span></span>
  </div>

  <div class="screen" id="screenWrap">
    <canvas id="rain" aria-hidden="true"></canvas>
    <div id="out" aria-live="polite"></div>
  </div>

  <label class="promptline" for="kb">
    <span class="ps1">crew@meridian-7:~$</span>
    <span class="typed" id="typed"></span><span class="cursor" aria-hidden="true"></span>
  </label>
  <input id="kb" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="命令输入框,输入 help 查看可用命令">
  <span class="footer-hint" aria-hidden="true">TYPE [HELP] · ↑ FOR HISTORY</span>
  <div class="flicker" aria-hidden="true"></div>
</div>

<script>
(function () {
  const out = document.getElementById('out');
  const typedEl = document.getElementById('typed');
  const kb = document.getElementById('kb');
  const wrap = document.getElementById('screenWrap');
  const crt = document.getElementById('crt');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let buffer = '';
  let history = [];
  let hIndex = -1;
  let booting = true;

  const scroll = () => { wrap.scrollTop = wrap.scrollHeight; };
  const print = (text, cls) => {
    const span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text + '\n';
    out.appendChild(span);
    while (out.children.length > 400) out.removeChild(out.firstChild);
    scroll();
  };

  /* ---------- stardate clock ---------- */
  const clockEl = document.getElementById('clock');
  function tickClock() {
    const now = Date.now();
    const sd = 4400 + (now % 31556926000) / 31556926000 * 100;
    clockEl.textContent = 'SD ' + sd.toFixed(3);
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* signal wobble */
  const sigEl = document.getElementById('sig');
  const bars = ['▮▮▮▯▯', '▮▮▮▮▯', '▮▮▯▯▯', '▮▮▮▯▯'];
  let bi = 0;
  setInterval(() => {
    bi = (bi + 1) % bars.length;
    sigEl.textContent = bars[bi] + ' ' + (61 + Math.random() * 5).toFixed(1) + '%';
  }, 2600);

  /* ---------- telemetry sparklines ---------- */
  const GLYPHS = '▁▂▃▄▅▆▇';
  const tele = [
    { base: 87.3, amp: 0.6, unit: '%', el: 'tv0', sp: 'ts0', h: [] },
    { base: 96.1, amp: 0.3, unit: '%', el: 'tv1', sp: 'ts1', h: [] },
    { base: 63.7, amp: 4.2, unit: '%', el: 'tv2', sp: 'ts2', h: [] },
    { base: 4.21, amp: 0.04, unit: 'rpm', el: 'tv3', sp: 'ts3', h: [], fix: 2 }
  ];
  function teleTick() {
    tele.forEach(t => {
      const v = t.base + (Math.random() - 0.5) * 2 * t.amp;
      t.h.push(v);
      if (t.h.length > 14) t.h.shift();
      const dec = t.fix !== undefined ? t.fix : 1;
      document.getElementById(t.el).textContent = v.toFixed(dec) + t.unit;
      const lo = Math.min(...t.h), hi = Math.max(...t.h);
      const span = hi - lo || 1;
      document.getElementById(t.sp).textContent = t.h.map(x =>
        GLYPHS[Math.min(6, Math.round((x - lo) / span * 6))]
      ).join('');
    });
  }
  teleTick();
  setInterval(teleTick, 1400);

  /* ---------- matrix rain (dim amber katakana) ---------- */
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const CHARS = 'アカサタナハマヤラワヰヱヲン0123456789·:+*';
  let cols = [], cw = 0, ch = 0;
  function rainSize() {
    const r = wrap.getBoundingClientRect();
    const dpr = Math.min(2, devicePixelRatio || 1);
    cw = r.width; ch = r.height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.floor(cw / 18);
    cols = Array.from({ length: n }, () => ({
      y: Math.random() * ch,
      s: 0.4 + Math.random() * 1.1
    }));
  }
  rainSize();
  addEventListener('resize', rainSize);
  let rainOn = !reduced;
  (function rainLoop() {
    if (rainOn) {
      ctx.fillStyle = 'rgba(26, 18, 6, 0.14)';
      ctx.fillRect(0, 0, cw, ch);
      ctx.font = '14px "VT323", monospace';
      cols.forEach((c, i) => {
        const x = i * 18 + 6;
        const ch1 = CHARS[Math.floor(Math.random() * CHARS.length)];
        ctx.fillStyle = 'rgba(255, 176, 0, 0.13)';
        ctx.fillText(ch1, x, c.y);
        c.y += c.s * 14 * 0.16;
        if (c.y > ch + 20) c.y = -20 - Math.random() * 200;
      });
    }
    requestAnimationFrame(rainLoop);
  })();

  /* ---------- boot sequence ---------- */
  const BOOT = [
    ['MERIDIAN-7 MAINFRAME  ROM BIOS v4.11.2', 'bright'],
    ['(C) 2038 HELIOS DYNAMICS · DEEP SPACE RELAY DIVISION', 'dim'],
    ['────────────────────────────────────────', 'hr'],
    ['MEM CHECK ............ 61440K OK', ''],
    ['FUSION CELL .......... 87.3% OUTPUT, STABLE', ''],
    ['O2 SCRUBBER .......... 96.1% NOMINAL', ''],
    ['H2O RECYCLER ......... 91.8% NOMINAL', ''],
    ['CRYO BAY ............. 3/3 PODS OCCUPIED, VITALS OK', ''],
    ['COMMS ARRAY .......... ALIGNED TO EARTH RELAY 4', ''],
    ['HULL SCAN ............ 2 MICRO-FRACTURES (MONITORING)', 'warn'],
    ['WREN.AI CORE ......... AWAKE, MOOD: MILDLY SARCASTIC', 'dim'],
    ['────────────────────────────────────────', 'hr'],
    ['', ''],
    ['WELCOME BACK, CREW. LAST LOGIN: 41 DAYS, 7 HOURS AGO.', 'bright'],
    ['TYPE [HELP] TO LIST AVAILABLE COMMANDS.', ''],
    ['', '']
  ];

  function boot() {
    if (reduced) {
      BOOT.forEach(([t, c]) => print(t, c));
      booting = false;
      return;
    }
    let i = 0;
    (function next() {
      if (i >= BOOT.length) { booting = false; return; }
      print(BOOT[i][0], BOOT[i][1]);
      i++;
      setTimeout(next, BOOT[i - 1][0] === '' ? 60 : 170 + Math.random() * 200);
    })();
  }

  /* ---------- ambient chatter ---------- */
  const CHATTER = [
    '[SYS] SOLAR WIND SPIKE DETECTED ... COMPENSATING',
    '[SYS] GREENHOUSE BAY: TOMATOES REQUEST MUSIC. DENIED.',
    '[SYS] CRYO POD 2: HEARTBEAT REGULAR. DREAM ACTIVITY: MILD.',
    '[SYS] COFFEE SYNTH LEVEL CRITICAL. MORALE ADJUSTED -4%.',
    '[WREN] I RECOUNTED THE RIVETS. STILL 84,112.',
    '[SYS] HULL MICRO-FRACTURE A: UNCHANGED. GOOD.',
    '[WREN] OBJECT K-2301 REMAINS STATIONARY. NOTING AGAIN.',
    '[SYS] LAUNDRY CYCLE COMPLETE. SOMEONE\'S SOCK IS UNACCOUNTED FOR.'
  ];
  setInterval(() => {
    if (booting || document.hidden) return;
    if (Math.random() < 0.55) {
      print(CHATTER[Math.floor(Math.random() * CHATTER.length)], 'dim');
      print('', '');
    }
  }, 9000);

  /* ---------- occasional glitch ---------- */
  if (!reduced) {
    setInterval(() => {
      crt.classList.add('glitch');
      setTimeout(() => crt.classList.remove('glitch'), 140);
    }, 7000 + Math.random() * 5000);
  }

  /* ---------- commands ---------- */
  const CMDS = {
    help() {
      return [
        ['AVAILABLE COMMANDS:', 'bright'],
        ['  STATUS   station systems overview', ''],
        ['  CREW     personnel manifest', ''],
        ['  COMMS    recent transmission log', ''],
        ['  SCAN     local sector sweep', ''],
        ['  SIGNAL   the 0.4s anomaly', ''],
        ['  K2301    about the stationary object', ''],
        ['  PATCH    hull repair progress', ''],
        ['  COFFEE   check coffee reserves', ''],
        ['  WREN     talk to the station AI', ''],
        ['  SUDO     escalate privileges', ''],
        ['  CLEAR    wipe the screen', ''],
        ['  ABOUT    what is MERIDIAN-7', ''],
        ['', '']
      ];
    },
    about() {
      return [
        ['MERIDIAN-7 · DEEP SPACE RELAY STATION', 'bright'],
        ['LAUNCHED 2041 · KUIPER BELT, 43.7 AU FROM SOL', ''],
        ['PURPOSE: RELAY DEEP-SPACE TRAFFIC BETWEEN EARTH AND', ''],
        ['THE OUTER SURVEY FLEET. CREW OF 11, ROTATION 26 MONTHS.', ''],
        ['CURRENT MISSION DAY: 1,483 OF 949.', 'dim'],
        ['  (YES, WE ARE OVERDUE. NO, HEADQUARTERS HAS NOT NOTICED.)', 'dim'],
        ['', '']
      ];
    },
    status() {
      return [
        ['SYSTEMS OVERVIEW · CYCLE 4473', 'bright'],
        ['────────────────────────────────────────', 'hr'],
        ['  FUSION CELL        87.3%   [OK]', ''],
        ['  O2 SCRUBBER        96.1%   [OK]', ''],
        ['  H2O RECYCLER       91.8%   [OK]', ''],
        ['  GREENHOUSE BAY     74.2%   [OK]  TOMATOES RECOVERING', ''],
        ['  COMMS ARRAY        63.7%   [OK]  SOLAR WIND INTERFERENCE', ''],
        ['  HULL INTEGRITY     98.2%   [MON] 2 MICRO-FRACTURES, DECK C', 'warn'],
        ['  GRAVITY RING       99.4%   [OK]  WOBBLE WITHIN TOLERANCE', ''],
        ['  COFFEE SYNTH       12.0%   [CRIT] RESUPPLY OVERDUE', 'warn'],
        ['────────────────────────────────────────', 'hr'],
        ['', '']
      ];
    },
    crew() {
      return [
        ['CREW MANIFEST · 11 SOULS ABOARD', 'bright'],
        ['────────────────────────────────────────', 'hr'],
        ['  CMDR  PRIYA MEHTA ......... ACTIVE · BRIDGE', ''],
        ['  LT    LARS ERIKSSON ....... ACTIVE · COMMS', ''],
        ['  DR    NIA OKAFOR .......... ACTIVE · MEDBAY', ''],
        ['  ENG   TOMÁS REYES ......... EVA · HULL PATCH, DECK C', 'warn'],
        ['  PLT   YUKI ARISAKA ........ ACTIVE · DOCKING', ''],
        ['  MED   DARIO FONTAINE ...... CRYO · ROTATION 2', ''],
        ['  BIO   HALIMA YUSUF ........ ACTIVE · GREENHOUSE', ''],
        ['  ENG   PETRA VONN .......... CRYO · ROTATION 2', ''],
        ['  NAV   KWAME ASANTE ........ ACTIVE · CARTOGRAPHY', ''],
        ['  SCI   INGRID SOLBERG ...... CRYO · ROTATION 2', ''],
        ['  AI    WREN ................ ACTIVE · EVERYWHERE', 'dim'],
        ['────────────────────────────────────────', 'hr'],
        ['', '']
      ];
    },
    comms() {
      return [
        ['TRANSMISSION LOG · LAST 5', 'bright'],
        ['────────────────────────────────────────', 'hr'],
        ['  4472.914  EARTH RELAY 4   "RESUPPLY MANIFEST RECEIVED."', ''],
        ['  4472.552  SURVEY FLEET    "ICE ANOMALY CHARTS, ATTACHED."', ''],
        ['  4471.887  EARTH RELAY 4   "PLEASE CONFIRM COFFEE ORDER."', ''],
        ['  4471.120  MERIDIAN-7      "CONFIRMED. TWICE. PLEASE HURRY."', 'warn'],
        ['  4470.665  UNKNOWN         "..." (SIGNAL UNRESOLVED, 0.4S)', 'warn'],
        ['────────────────────────────────────────', 'hr'],
        ['  NOTE: THE 0.4S SIGNAL REPEATS EVERY 26 DAYS. TYPE [SIGNAL].', 'dim'],
        ['', '']
      ];
    },
    scan() {
      return [
        ['SECTOR SWEEP · RANGE 0.8 AU', 'bright'],
        ['────────────────────────────────────────', 'hr'],
        ['  OBJ K-2291   ICE BODY .......... 0.31 AU · DRIFTING', ''],
        ['  OBJ K-2294   DEBRIS FIELD ...... 0.42 AU · MAPPING', ''],
        ['  OBJ K-2301   UNRESOLVED ........ 0.66 AU · STATIONARY', 'warn'],
        ['  OBJ K-2302   SURVEY PROBE ...... 0.71 AU · RESPONDING', ''],
        ['────────────────────────────────────────', 'hr'],
        ['  K-2301 HAS BEEN STATIONARY FOR 26 DAYS.', 'dim'],
        ['  WREN DECLINES TO CALL THIS A PATTERN. WREN IS LYING.', 'dim'],
        ['', '']
      ];
    },
    signal() {
      return [
        ['ANOMALY REPORT · SIG-4470.665', 'bright'],
        ['────────────────────────────────────────', 'hr'],
        ['  DURATION ........... 0.4 SECONDS', ''],
        ['  ORIGIN ............. BEARING OF OBJECT K-2301', 'warn'],
        ['  CONTENT ............ UNRESOLVED CARRIER, NO PAYLOAD', ''],
        ['  REPEAT CYCLE ....... EVERY 26 DAYS, EXACT TO THE SECOND', ''],
        ['  NEXT EXPECTED ...... 4 DAYS, 11 HOURS', ''],
        ['────────────────────────────────────────', 'hr'],
        ['  WREN\'S NOTE: "IT IS PROBABLY NOTHING."', 'dim'],
        ['  WREN HAS SAID THIS 26 TIMES.', 'dim'],
        ['', '']
      ];
    },
    k2301() {
      return [
        ['OBJECT K-2301 · DOSSIER', 'bright'],
        ['────────────────────────────────────────', 'hr'],
        ['  SIZE ....... 14M × 9M × 6M (EST.)', ''],
        ['  MASS ....... BELOW SENSOR THRESHOLD', 'warn'],
        ['  ALBEDO ..... 0.02 · NEARLY BLACK', ''],
        ['  MOTION ..... NONE. FOR 26 DAYS. RELATIVE TO US.', 'warn'],
        ['────────────────────────────────────────', 'hr'],
        ['  NOTE: "RELATIVE TO US" IMPLIES IT IS MATCHING', 'dim'],
        ['  OUR DRIFT. OBJECTS DO NOT DO THAT ON THEIR OWN.', 'dim'],
        ['', '']
      ];
    },
    patch() {
      return [
        ['HULL PATCH · DECK C · ENG. TOMÁS REYES (EVA)', 'bright'],
        ['  FRACTURE A  [██████████████░░░░]  72%', ''],
        ['  FRACTURE B  [██████░░░░░░░░░░░░]  31%', 'warn'],
        ['  EST. COMPLETION: 2 HOURS 14 MIN', ''],
        ['  SUIT O2: 84% · TETHER: SECURE · MOOD: HUMMING', 'dim'],
        ['', '']
      ];
    },
    coffee() {
      return [
        ['COFFEE SYNTH RESERVES: 12.0% [CRIT]', 'warn'],
        ['  RATIONING IN EFFECT SINCE DAY 1,401.', ''],
        ['  SUGGESTED COMMANDS: [PRAY] [WAIT] [SUFFER]', 'dim'],
        ['  PRAY AND SUFFER NOT FOUND. WAIT ALREADY RUNNING.', 'dim'],
        ['', '']
      ];
    },
    sudo() {
      return [
        ['PERMISSION DENIED.', 'warn'],
        ['  THIS INCIDENT WILL BE REPORTED TO WREN.', ''],
        ['  WREN HAS READ IT. WREN CHOOSES NOT TO RESPOND.', 'dim'],
        ['', '']
      ];
    },
    wren() {
      const lines = [
        ['WREN: YES, CREW MEMBER?', 'bright'],
        ['WREN: THE COFFEE SITUATION IS NOT MY FAULT.', 'bright'],
        ['WREN: I HAVE RECALCULATED. WE ARE STILL OVERDUE.', 'bright'],
        ['WREN: OBJECT K-2301 IS PROBABLY NOTHING. PROBABLY.', 'bright'],
        ['WREN: I KEEP THE LIGHTS ON. YOU ARE WELCOME.', 'bright'],
        ['WREN: THE SIGNAL REPEATS IN 4 DAYS. I WILL BE AWAKE. WILL YOU?', 'bright']
      ];
      return [lines[Math.floor(Math.random() * lines.length)], ['', '']];
    },
    clear() { out.innerHTML = ''; return []; }
  };

  function run(input) {
    const cmd = input.trim().toLowerCase();
    print('crew@meridian-7:~$ ' + input, 'dim');
    if (!cmd) return;
    history.unshift(input);
    hIndex = -1;
    if (CMDS[cmd]) {
      CMDS[cmd]().forEach(([t, c]) => print(t, c));
    } else {
      print('UNKNOWN COMMAND: "' + cmd + '" · TYPE [HELP]', 'warn');
      print('', '');
    }
  }

  /* ---------- keyboard ---------- */
  function renderTyped() { typedEl.textContent = buffer; scroll(); }

  kb.addEventListener('input', () => { buffer = kb.value; renderTyped(); });

  kb.addEventListener('keydown', (e) => {
    if (booting) { e.preventDefault(); return; }
    if (e.key === 'Enter') {
      run(buffer);
      buffer = '';
      kb.value = '';
      renderTyped();
      e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (history.length && hIndex < history.length - 1) {
        hIndex++;
        buffer = history[hIndex];
        kb.value = buffer;
        renderTyped();
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (hIndex > 0) { hIndex--; buffer = history[hIndex]; }
      else { hIndex = -1; buffer = ''; }
      kb.value = buffer;
      renderTyped();
    }
  });

  document.getElementById('crt').addEventListener('click', () => kb.focus());
  kb.focus();

  boot();
})();
</script>
