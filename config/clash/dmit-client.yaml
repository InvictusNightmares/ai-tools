# 客户端订阅扩展配置（Merge），不要填到 3x-ui，也不是独立订阅。
# 适用于关闭“DNS 覆写”的 Clash Verge 2.5.2；2.5.5+（含 2.5.8）开启 DNS 覆写时，
# 请把 DNS 值填到应用 DNS 页，并从 Merge 删除 dns 段，见 dmit-verge-2.5.5-example.md。
# 仍需选择规则模式，并关闭全局 IPv6。
mode: rule
ipv6: false
tcp-concurrent: true
keep-alive-idle: 15
keep-alive-interval: 15
geo-auto-update: true
geo-update-interval: 168

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - 'time.*.com'
    - 'time.*.apple.com'
    - 'ntp.*.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - '*.msftncsi.com'
    - www.msftconnecttest.com
    # 本机按需在应用 DNS 页追加私有内网/公司/自建服务域名，不要提交到公开仓库。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    'time.*.com':
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    'time.*.apple.com':
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    'ntp.*.com':
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    '+.stun.*.*':
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    '+.stun.*.*.*':
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    '*.msftncsi.com':
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    www.msftconnecttest.com:
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    localhost.ptlogin2.qq.com:
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    localhost.sec.qq.com:
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  fallback: []
