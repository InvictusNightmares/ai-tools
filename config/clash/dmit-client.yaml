# 客户端订阅扩展配置（Merge），不要填到 3x-ui，也不是独立订阅。
# 适用于关闭“DNS 覆写”的 Clash Verge 2.5.2；2.5.5+（含 2.5.8）开启 DNS 覆写时，
# 请把 DNS 值填到应用 DNS 页，并从 Merge 删除 dns 段，见 dmit-verge-2.5.5-example.md。
# 仍需选择规则模式，并关闭全局 IPv6。
mode: rule
ipv6: false

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - localhost.ptlogin2.qq.com
    - '*.msftncsi.com'
    - www.msftconnecttest.com
  default-nameserver:
    - 223.5.5.5
    - 1.2.4.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://9.9.9.9/dns-query
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
    - 180.76.76.76
  direct-nameserver-follow-policy: true
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  fallback: []
